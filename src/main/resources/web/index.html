<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>功能开关追踪器</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>功能开关追踪器</h1>
    <div class="header-actions">
      <button id="btn-export">导出</button>
      <button id="btn-import">导入</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="flags">开关与规则</button>
    <button class="tab" data-tab="evaluate">求值</button>
    <button class="tab" data-tab="compare">版本对比</button>
    <button class="tab" data-tab="history">历史轨迹</button>
    <button class="tab" data-tab="settings">项目设置</button>
  </nav>
  <main>
    <section id="tab-flags" class="tab-panel active">
      <div class="cols">
        <div class="col flag-list-col">
          <h2>开关列表</h2>
          <div class="row">
            <input id="new-flag-key" placeholder="开关 key">
            <input id="new-flag-default" placeholder="默认值 (JSON)" value="&quot;off&quot;">
            <button id="btn-create-flag">创建</button>
          </div>
          <ul id="flag-list" class="flag-list"></ul>
        </div>
        <div class="col editor-col">
          <div id="flag-editor" class="hidden">
            <h2>编辑草稿: <span id="editor-flag-key"></span></h2>
            <div class="row">
              <label>salt <input id="edit-salt"></label>
              <label>默认值 <input id="edit-default"></label>
            </div>
            <h3>前置开关</h3>
            <div id="prereq-list"></div>
            <button id="btn-add-prereq">+ 前置</button>
            <h3>规则（按顺序求值，可拖动排序）</h3>
            <div id="rule-list"></div>
            <button id="btn-add-rule">+ 规则</button>
            <div class="row actions">
              <button id="btn-save-draft" class="primary">保存草稿</button>
              <button id="btn-publish" class="primary">发布新版本</button>
            </div>
            <div id="editor-msg" class="msg"></div>
            <h3>已发布版本</h3>
            <ul id="version-list"></ul>
          </div>
          <div id="editor-empty">请选择或创建一个开关。</div>
        </div>
      </div>
    </section>
    <section id="tab-evaluate" class="tab-panel">
      <div class="cols">
        <div class="col">
          <h2>上下文</h2>
          <textarea id="eval-context" rows="10" spellcheck="false">{"key": "user-1", "country": "JP", "age": 30}</textarea>
          <div class="row">
            <select id="eval-flag"></select>
            <select id="eval-version"></select>
            <label><input type="checkbox" id="eval-save"> 保存记录</label>
            <button id="btn-eval" class="primary">求值</button>
          </div>
          <div class="row">
            <input id="ctx-name" placeholder="上下文名称">
            <button id="btn-save-ctx">保存上下文</button>
          </div>
          <h3>已保存上下文</h3>
          <ul id="ctx-list"></ul>
          <h3>批量求值（同一版本快照）</h3>
          <button id="btn-batch">对全部已保存上下文批量求值</button>
          <div id="batch-result"></div>
        </div>
        <div class="col">
          <h2>求值结果</h2>
          <div id="eval-result"></div>
          <h2>逐步轨迹</h2>
          <div id="eval-trace"></div>
        </div>
      </div>
    </section>
    <section id="tab-compare" class="tab-panel">
      <h2>比较两个版本对保存上下文的影响</h2>
      <div class="row">
        <select id="cmp-flag"></select>
        <select id="cmp-v1"></select>
        <select id="cmp-v2"></select>
        <button id="btn-compare" class="primary">比较</button>
      </div>
      <div id="cmp-result"></div>
    </section>
    <section id="tab-history" class="tab-panel">
      <h2>历史求值记录（绑定版本，不随规则变化）</h2>
      <div id="history-list"></div>
    </section>
    <section id="tab-settings" class="tab-panel">
      <h2>项目设置</h2>
      <p>项目 ID: <code id="project-id"></code></p>
      <label>敏感字段（逗号分隔，轨迹中只显示 HMAC 摘要）:
        <input id="sensitive-fields" size="60">
      </label>
      <button id="btn-save-settings" class="primary">保存</button>
      <div id="settings-msg" class="msg"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
